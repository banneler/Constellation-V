<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CC day timeline ledger geometry</title>
  <link rel="stylesheet" href="../../output.css">
  <style>
    body { margin: 0; background: #0f1419; color: #e8eef5; }
    .wrap { width: 320px; height: 480px; padding: 12px; box-sizing: border-box; }
    .cc-month-day-list { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="cc-month-day-list" id="day-list">
      <div class="cc-day-timeline" data-day-key="2026-07-30">
        <div class="cc-day-timeline-rail" aria-hidden="true">
          <div class="cc-day-timeline-hour" style="top:0%;height:0"><span class="cc-day-timeline-hour-label">7 AM</span></div>
          <div class="cc-day-timeline-hour" style="top:50%;height:0"><span class="cc-day-timeline-hour-label">12 PM</span></div>
          <div class="cc-day-timeline-hour" style="top:100%;height:0"><span class="cc-day-timeline-hour-label">6 PM</span></div>
        </div>
        <div class="cc-day-timeline-rule" aria-hidden="true"></div>
        <div class="cc-day-timeline-track" id="cc-day-timeline-track">
          <div class="cc-day-timeline-canvas">
            <div class="cc-day-timeline-hover is-active" style="top:9.09%;height:9.09%"></div>
            <div class="cc-day-timeline-event" style="top:18.18%;height:13.64%">
              <div class="cc-day-timeline-event-when">9:00 AM</div>
              <div class="cc-day-timeline-event-title">Ledger check A</div>
            </div>
            <div class="cc-day-timeline-event" style="top:45.45%;height:9.09%">
              <div class="cc-day-timeline-event-when">12:00 PM</div>
              <div class="cc-day-timeline-event-title">Ledger check B</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
