<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="description" content="Constellation CRM: A powerful and intuitive tool for managing your sales pipeline, contacts, and deals.">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Constellation">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/constellation-logo-c.svg">
    <title>Constellation CRM - Command Center</title>
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="css/global-loader.css">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.5.2/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="global-loader-overlay" class="global-loader-overlay active" aria-live="polite" aria-busy="true">
        <div class="global-loader-content">
            <div class="global-loader-spinner" aria-hidden="true">
                <svg class="global-loader-svg global-loader-constellation" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path class="global-loader-constellation-line" pathLength="1" d="M24 8 L10 22 L18 38 L30 38 L38 22 L24 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle class="global-loader-star" cx="24" cy="8" r="2.2"/><circle class="global-loader-star" cx="10" cy="22" r="1.8"/><circle class="global-loader-star" cx="18" cy="38" r="2"/><circle class="global-loader-star" cx="30" cy="38" r="1.8"/><circle class="global-loader-star" cx="38" cy="22" r="2"/>
                </svg>
            </div>
            <p class="global-loader-text">Loading…</p>
        </div>
    </div>
    <div class="crm-container">
       <nav class="nav-sidebar">
            <script>(function(){try{if(localStorage.getItem('crm-nav-collapsed')==='1')document.currentScript.parentElement.classList.add('nav-sidebar-collapsed');}catch(e){}})();</script>
            <div id="global-nav-container" class="flex flex-col flex-1 min-h-0"></div>
        </nav>
        
        <main class="content-area">
            <div id="dashboard" class="content-view active-view">
                
                <div id="dashboard-sections-grid" class="dashboard-sections-grid">
                <div class="dashboard-column-left">
                <div class="dashboard-left-top-row">
                    <div class="section-card ai-briefing-card">
                        <div class="section-card-header flex justify-between items-center gap-3">
                            <h2 class="section-title">AI Daily Briefing</h2>
                            <button type="button" id="ai-briefing-refresh-btn" class="btn-primary btn-icon-header" title="Refresh Briefing"><i class="fas fa-rotate-right"></i></button>
                        </div>
                        <div id="ai-briefing-container" class="ai-briefing-content hidden"></div>
                        <div id="ai-briefing-placeholder" class="ai-briefing-placeholder px-4 pb-4 text-sm text-[var(--text-medium)]">Loading your briefing...</div>
                    </div>
                    <div class="section-card my-tasks-card" id="my-tasks-card">
                        <div class="section-card-header flex justify-between items-center gap-3">
                            <h2 class="section-title">My Tasks</h2>
                            <button type="button" id="my-tasks-hamburger" class="my-tasks-hamburger btn-primary btn-icon-header" title="Add task" aria-label="Add task">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                        <div class="my-tasks-body">
                            <div class="quick-add-card" id="quick-add-card">
                                <form id="quick-add-task-form" class="quick-add-task-form">
                                    <input type="text" id="quick-add-description" placeholder="Description" required class="quick-add-input">
                                    <div class="quick-add-row quick-add-links-row">
                                        <select id="quick-add-contact" class="quick-add-input">
                                            <option value="">Link to Contact</option>
                                        </select>
                                        <select id="quick-add-account" class="quick-add-input">
                                            <option value="">Link to Account</option>
                                        </select>
                                    </div>
                                    <div class="quick-add-row">
                                        <input type="date" id="quick-add-due-date" class="quick-add-input">
                                        <button type="submit" class="btn-primary text-xs py-1 px-2">Add</button>
                                    </div>
                                </form>
                            </div>
                            <div id="my-tasks-list" class="my-tasks-list"></div>
                        </div>
                    </div>
                </div>

                <div class="section-card cc-desktop-only" aria-hidden="true">
                    <div class="section-card-header flex justify-between items-center gap-3">
                        <h2 class="section-title">Sequence Steps</h2>
                        <div class="sequence-steps-toggle flex rounded-lg border border-[var(--border-color)] p-0.5 bg-[var(--bg-medium)]">
                            <button type="button" id="sequence-toggle-due" class="sequence-toggle-btn active rounded-md px-3 py-1.5 text-sm font-medium transition-colors">Due</button>
                            <button type="button" id="sequence-toggle-upcoming" class="sequence-toggle-btn rounded-md px-3 py-1.5 text-sm font-medium transition-colors">Upcoming</button>
                        </div>
                    </div>
                    <div id="sequence-steps-list" class="sequence-steps-list"></div>
                </div>

                </div>

                <div class="dashboard-column-right cc-desktop-only" aria-hidden="true">
                <div class="section-card cc-calendar-card">
                    <div class="section-card-header flex justify-between items-center gap-3">
                        <h2 class="section-title">Upcoming Calendar</h2>
                        <div id="cc-calendar-actions" class="cc-calendar-actions hidden">
                            <button type="button" id="cc-calendar-month-btn" class="btn-secondary btn-icon-header" title="Month view" aria-label="Open month calendar">
                                <i class="fa-solid fa-calendar-days"></i>
                            </button>
                            <button type="button" id="cc-calendar-add-btn" class="btn-primary btn-icon-header" title="Add event" aria-label="Add calendar event">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>
                    <div id="cc-calendar-list" class="cc-calendar-list"></div>
                </div>

                <div class="section-card cc-recent-activities-card">
                    <div class="section-card-header">
                        <h2 class="section-title">Recent Activities</h2>
                    </div>
                    <div id="recent-activities-list" class="recent-activities-list"></div>
                </div>

                </div>

                </div>
                </div>
            </div>
        </main>
    </div>

       <div id="modal-backdrop" class="modal-backdrop hidden">
        <div class="modal-content">
            <h3 id="modal-title"></h3>
            <div id="modal-body"></div>
            <div id="modal-actions" class="modal-actions">
                </div>
        </div>
    </div>

    <div id="cc-month-calendar-backdrop" class="modal-backdrop cc-month-calendar-backdrop hidden" aria-hidden="true">
        <div class="cc-month-calendar-modal" role="dialog" aria-modal="true" aria-labelledby="cc-month-calendar-title">
            <div class="cc-month-calendar-header">
                <div class="cc-month-calendar-nav">
                    <button type="button" id="cc-month-prev-btn" class="cc-month-nav-btn" title="Previous month" aria-label="Previous month">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <h3 id="cc-month-calendar-title" class="cc-month-calendar-title">Month</h3>
                    <button type="button" id="cc-month-next-btn" class="cc-month-nav-btn" title="Next month" aria-label="Next month">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
                <button type="button" id="cc-month-calendar-close" class="cc-month-calendar-close" title="Close" aria-label="Close month calendar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="cc-month-calendar-body">
                <div class="cc-month-grid-wrap">
                    <div class="cc-month-weekday-row" id="cc-month-weekday-row"></div>
                    <div class="cc-month-grid" id="cc-month-grid"></div>
                </div>
                <aside class="cc-month-day-panel" aria-live="polite">
                    <div class="cc-month-day-panel-header">
                        <h4 id="cc-month-day-heading" class="cc-month-day-heading">Select a day</h4>
                        <button type="button" id="cc-month-day-add-btn" class="cc-month-day-add-btn hidden" title="Add event" aria-label="Add event on this day">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                    <div id="cc-month-day-list" class="cc-month-day-list"></div>
                </aside>
            </div>
        </div>
    </div>
    <script>
    // This script runs synchronously to apply the theme before the page renders
    (function() {
        const savedTheme = localStorage.getItem('crm-theme') || 'dark';
        document.body.className = `theme-${savedTheme} command-center-page`;
    })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.5.2/dist/js/tom-select.complete.min.js"></script>
    <script type="module" src="js/command-center.js"></script>
</body>

</html>
